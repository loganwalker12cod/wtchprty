<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Room {{ room }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #0d0d0d;
            color: #d8d8d8;
            font: 15px/1.4 system-ui, sans-serif
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #222;
            margin-bottom: 16px;
            gap: 12px
        }

        header h1 {
            font-size: 16px;
            font-weight: 600
        }

        header h1 span {
            color: #777;
            margin-left: 8px;
            font-weight: 400
        }

        .right {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #777
        }

        .stage {
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            border: 1px solid #222
        }

        .stage>* {
            width: 100%;
            height: 100%;
            display: none;
            border: 0
        }

        .stage>.empty {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555
        }

        .bar {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            align-items: center
        }

        input[type=text] {
            flex: 1;
            min-width: 200px;
            background: #161616;
            border: 1px solid #2a2a2a;
            color: #d8d8d8;
            padding: 9px 10px;
            font: inherit;
            outline: none
        }

        input[type=text]:focus {
            border-color: #555
        }

        button,
        .btn {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            color: #d8d8d8;
            padding: 9px 14px;
            font: inherit;
            cursor: pointer
        }

        button:hover,
        .btn:hover {
            background: #262626
        }

        input[type=file] {
            display: none
        }

        input[type=range] {
            accent-color: #888
        }

        #seek {
            flex: 1;
            min-width: 120px
        }

        #vol {
            width: 90px
        }

        #time {
            color: #888;
            min-width: 96px
        }

        .lonly {
            display: none
        }

        .lonly.on {
            display: inline-block
        }

        #msg {
            color: #c9a227;
            margin-top: 12px;
            min-height: 20px
        }

        #chat {
            margin-top: 12px;
            border: 1px solid #222
        }

        #log {
            height: 180px;
            overflow-y: auto;
            padding: 8px 10px;
            color: #bbb;
            word-break: break-word
        }

        #log b {
            color: #888;
            font-weight: 600
        }

        #cf {
            display: flex;
            border-top: 1px solid #222
        }

        #cf input {
            flex: 1;
            background: #161616;
            border: 0;
            color: #d8d8d8;
            padding: 9px 10px;
            font: inherit;
            outline: none
        }

        #cf button {
            border: 0;
            border-left: 1px solid #222
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            z-index: 9
        }

        .overlay p {
            color: #777
        }
    </style>
</head>

<body>

    <div class="overlay" id="enter">
        <p>Room {{ room }}</p>
        <button onclick="enter()">Enter</button>
    </div>

    <div class="wrap">
        <header>
            <h1>Watch Party<span>{{ room }}</span></h1>
            <div class="right"><span id="info"></span><button onclick="copyLink(this)">Copy link</button></div>
        </header>

        <div class="stage" id="stage">
            <div class="empty" id="empty">Nothing loaded</div>
            <div id="yt"></div>
            <video id="v" playsinline></video>
        </div>

        <div class="bar" id="hostbar" style="display:none">
            <input type="text" id="url" placeholder="YouTube link">
            <button onclick="loadYT()">Load</button>
            <label class="btn" for="file">Local file</label>
            <input type="file" id="file" accept="video/*">
            <button onclick="resync()">Sync</button>
        </div>
        <div class="bar" id="viewbar" style="display:none">
            <button class="lonly" id="pp">Pause</button>
            <input type="range" class="lonly" id="seek" min="0" max="0" step="1" value="0">
            <span class="lonly" id="time">0:00</span>
            <button onclick="stage.requestFullscreen()">Fullscreen</button>
            <input type="range" id="vol" min="0" max="100" value="100">
            <button onclick="resync()">Sync</button>
        </div>
        <div id="msg"></div>

        <div id="chat">
            <div id="log"></div>
            <form id="cf"><input type="text" id="ci" placeholder="Message (/nick name to rename)" maxlength="300"
                    autocomplete="off"><button>Send</button></form>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        const room = {{ room| tojson }}, sock = io();
        const RTC = { iceServers: {{ ice| tojson }}};
        const $ = id => document.getElementById(id);
        const vid = $('v'), stage = $('stage'), msg = $('msg'), empty = $('empty'), info = $('info');
        let role = null, hostId = null, viewers = [], kind = null, yt = null, ytReady = false, pending = null, mute = 0, lastT = 0, lastW = performance.now();
        let stream = null, lastPos = null, seeking = false; const peers = {}, iceQ = {};
        const quiet = () => { mute = Date.now() + 600 }, muted = () => Date.now() < mute;
        const fmt = s => { s = Math.max(0, s | 0); const h = s / 3600 | 0, m = (s % 3600) / 60 | 0; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };

        /* ---------- server clock offset (latency compensation) ---------- */
        let off = 0, best = 1e9;
        const srvNow = () => (Date.now() + off) / 1000;
        function clockSample() {
            const c0 = Date.now();
            sock.emit('time', s => { const c1 = Date.now(), rtt = c1 - c0; if (rtt <= best + 20) { best = Math.min(best, rtt); off = s * 1000 + rtt / 2 - c1; } });
        }
        sock.on('connect', () => { for (let i = 0; i < 6; i++)setTimeout(clockSample, i * 250); });
        setInterval(clockSample, 20000);

        /* ---------- ui state ---------- */
        function updUI() {
            $('hostbar').style.display = role === 'host' ? 'flex' : 'none';
            $('viewbar').style.display = role === 'viewer' ? 'flex' : 'none';
            document.querySelectorAll('.lonly').forEach(e => e.classList.toggle('on', role === 'viewer' && kind === 'local'));
            vid.controls = (role === 'host');
        }
        function show(k) {
            kind = k;
            empty.style.display = k ? 'none' : 'flex';
            const y = $('yt'); if (y) y.style.display = k === 'yt' ? 'block' : 'none';
            vid.style.display = k === 'local' ? 'block' : 'none';
            if (k !== 'yt' && yt && ytReady) { try { yt.pauseVideo() } catch (e) { } }
            if (k !== 'local') { vid.pause(); }
            updUI();
        }

        /* ---------- youtube (all synced) ---------- */
        const ready = () => kind === 'yt' && ytReady;
        const cur = () => yt.getCurrentTime();
        const playing = () => yt.getPlayerState() === 1;
        function send() { if (!ready() || muted()) return; sock.emit('ctl', { playing: playing(), t: cur(), at: srvNow() }); }
        function apply(p, t, at) {
            if (!ready()) { pending = { p, t, at }; return; }
            if (p && at) t += Math.max(0, Math.min(60, srvNow() - at));
            quiet();
            if (Math.abs(cur() - t) > 0.4) yt.seekTo(t, true);
            p ? yt.playVideo() : yt.pauseVideo();
        }
        function flush() { if (pending && ready()) { const x = pending; pending = null; apply(x.p, x.t, x.at); } }
        function openYT(id) {
            if (!window.YT || !YT.Player) { setTimeout(() => openYT(id), 300); return; }
            closeAll(); stream = null; vid.srcObject = null; vid.removeAttribute('src');
            ytReady = false; msg.textContent = '';
            if (yt) { try { yt.destroy() } catch (e) { } yt = null; }
            if (!$('yt')) { const d = document.createElement('div'); d.id = 'yt'; stage.insertBefore(d, vid); }
            show('yt');
            yt = new YT.Player('yt', {
                host: 'https://www.youtube-nocookie.com', videoId: id, width: '100%', height: '100%', playerVars: { playsinline: 1 }, events: {
                    onReady: () => { ytReady = true; flush(); },
                    onStateChange: e => { if (e.data === 1 || e.data === 2) send(); }
                }
            });
        }
        setInterval(() => {
            const w = performance.now(), dt = (w - lastW) / 1000; lastW = w;
            if (!ready()) return;
            const t = cur();
            if (!muted() && Math.abs(t - lastT - (playing() ? dt : 0)) > 1) send();
            lastT = t;
        }, 250);
        function loadYT() {
            if (role !== 'host') return;
            const m = $('url').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
            if (!m) { msg.textContent = 'Invalid YouTube link'; return; }
            pending = null; openYT(m[1]); sock.emit('load', { kind: 'yt', id: m[1] });
        }

        /* ---------- local file over webrtc ---------- */
        function resync() {
            sock.emit('resync');
            if (role === 'viewer' && kind === 'local' && hostId) sock.emit('signal', { to: hostId, data: { retry: true } });
        }
        function nudge() {  // paused captured video sends no frames until something changes
            if (vid.paused && vid.readyState > 0) { try { vid.currentTime = Math.min(vid.duration || 1e9, vid.currentTime + 0.05); } catch (e) { } }
        }
        function closePeer(id) { if (peers[id]) { peers[id].close(); delete peers[id]; } delete iceQ[id]; }
        function closeAll() { Object.keys(peers).forEach(closePeer); }
        function startStream() {
            const cap = vid.captureStream || vid.mozCaptureStream;
            if (!cap) { msg.textContent = 'This browser cannot stream files. Use Chrome or Firefox.'; return; }
            stream = cap.call(vid);
            if (!stream.getTracks().length) { vid.addEventListener('playing', startStream, { once: true }); return; }
            syncPeers();
        }
        function syncPeers() {
            if (role !== 'host' || kind !== 'local' || !stream) return;
            viewers.forEach(id => { if (!peers[id]) offerTo(id); });
        }
        async function offerTo(id) {
            const pc = new RTCPeerConnection(RTC); peers[id] = pc;
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            pc.onicecandidate = e => e.candidate && sock.emit('signal', { to: id, data: { ice: e.candidate } });
            pc.onconnectionstatechange = () => { if (pc.connectionState === 'connected') nudge(); };
            await pc.setLocalDescription(await pc.createOffer());
            sock.emit('signal', { to: id, data: { sdp: pc.localDescription } });
            pc.getSenders().forEach(s => {
                if (s.track && s.track.kind === 'video') {
                    const p = s.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
                    p.encodings[0].maxBitrate = 2500000; s.setParameters(p).catch(() => { });
                }
            });
        }
        async function flushIce(id) {
            const pc = peers[id]; if (!pc || !pc.remoteDescription) return;
            for (const c of (iceQ[id] || [])) await pc.addIceCandidate(c).catch(() => { });
            iceQ[id] = [];
        }
        sock.on('signal', async ({ from, data }) => {
            if (data.retry) { if (role === 'host' && kind === 'local' && stream) { closePeer(from); syncPeers(); } return; }
            if (data.sdp) {
                if (data.sdp.type === 'offer') {
                    closePeer(from);
                    const pc = new RTCPeerConnection(RTC); peers[from] = pc;
                    msg.textContent = 'Connecting to host...';
                    pc.ontrack = e => {
                        vid.srcObject = e.streams[0];
                        vid.play().catch(() => { vid.muted = true; vid.play().catch(() => { }); msg.textContent = 'Browser blocked sound. Move the volume slider to unmute.'; });
                    };
                    pc.onconnectionstatechange = () => {
                        const st = pc.connectionState;
                        if (st === 'connected') { if (/^(Connecting|P2P)/.test(msg.textContent)) msg.textContent = ''; }
                        else if (st === 'failed') msg.textContent = 'P2P connection failed. Press Sync to retry. If it keeps failing, the host needs a TURN server.';
                    };
                    pc.onicecandidate = e => e.candidate && sock.emit('signal', { to: from, data: { ice: e.candidate } });
                    await pc.setRemoteDescription(data.sdp);
                    await pc.setLocalDescription(await pc.createAnswer());
                    sock.emit('signal', { to: from, data: { sdp: pc.localDescription } });
                } else if (peers[from]) { await peers[from].setRemoteDescription(data.sdp); }
                flushIce(from);
            } else if (data.ice) { (iceQ[from] = iceQ[from] || []).push(data.ice); flushIce(from); }
        });
        $('file').onchange = e => {
            const f = e.target.files[0]; e.target.value = ''; if (!f || role !== 'host') return;
            closeAll(); stream = null; vid.srcObject = null;
            vid.src = URL.createObjectURL(f); show('local'); msg.textContent = '';
            vid.onloadeddata = startStream;
            sock.emit('load', { kind: 'local', id: f.name });
        };

        /* host reports position; viewers send play/pause/seek requests to host */
        function pos() {
            if (role !== 'host' || kind !== 'local' || !vid.readyState) return;
            sock.emit('pos', { t: vid.currentTime, d: vid.duration || 0, p: !vid.paused });
        }
        ['play', 'pause', 'seeked'].forEach(ev => vid.addEventListener(ev, pos));
        setInterval(pos, 1000);
        sock.on('req', d => {
            if (role !== 'host' || kind !== 'local' || !vid.readyState) return;
            if (typeof d.t === 'number') vid.currentTime = d.t;
            if (typeof d.playing === 'boolean') d.playing ? vid.play().catch(() => { }) : vid.pause();
        });
        sock.on('pos', d => {
            lastPos = d;
            $('pp').textContent = d.p ? 'Pause' : 'Play';
            if (!seeking) { $('seek').max = d.d; $('seek').value = d.t; }
            $('time').textContent = fmt(d.t) + ' / ' + fmt(d.d);
        });
        $('pp').onclick = () => sock.emit('req', { playing: lastPos ? !lastPos.p : true });
        $('seek').oninput = () => { seeking = true; $('time').textContent = fmt($('seek').value) + ' / ' + fmt($('seek').max); };
        $('seek').onchange = () => { seeking = false; sock.emit('req', { t: +$('seek').value }); };
        $('vol').oninput = e => { const v = e.target.value / 100; vid.muted = false; vid.volume = v; if (yt && ytReady) yt.setVolume(v * 100); };

        /* ---------- server events ---------- */
        sock.on('roster', d => {
            const was = role;
            role = d.host === sock.id ? 'host' : 'viewer'; viewers = d.viewers; hostId = d.host;
            if (was && was !== role) { closeAll(); stream = null; }
            info.textContent = role + ' / ' + viewers.length + ' of ' + d.max + ' viewers';
            updUI();
            if (role === 'host') Object.keys(peers).forEach(id => { if (!viewers.includes(id)) closePeer(id); });
            syncPeers();
        });
        function waitStream() { closeAll(); vid.srcObject = null; vid.removeAttribute('src'); show('local'); msg.textContent = 'Waiting for host stream'; }
        sock.on('load', d => { pending = null; d.kind === 'yt' ? openYT(d.id) : waitStream(); });
        sock.on('state', d => {
            if (d.kind === 'yt') {
                if (kind === 'yt') { apply(d.playing, d.t, d.at); }
                else { pending = { p: d.playing, t: d.t, at: d.at }; openYT(d.id); }
            } else if (kind !== 'local') waitStream();
        });
        sock.on('ctl', d => apply(d.playing, d.t, d.at));
        sock.on('reset', () => { closeAll(); stream = null; vid.srcObject = null; vid.removeAttribute('src'); show(null); msg.textContent = 'Host left. New host must load something.'; });
        sock.on('full', d => block('Room full (max ' + d.max + ' viewers)'));
        sock.on('kicked', () => block('Removed by admin'));
        sock.on('disconnect', r => { if (r === 'io server disconnect') block('Removed by admin'); });

        /* ---------- chat ---------- */
        let nick = null;
        try { nick = localStorage.getItem('nick'); } catch (e) { }
        nick = nick || ('user' + Math.floor(100 + Math.random() * 900));
        const log = $('log'), ci = $('ci');
        function addMsg(m) {
            const d = document.createElement('div'), b = document.createElement('b');
            if (m.name) b.textContent = m.name + ' ';
            d.append(b, document.createTextNode(m.text));
            log.append(d);
            while (log.children.length > 100) log.firstChild.remove();
            log.scrollTop = log.scrollHeight;
        }
        $('cf').onsubmit = e => {
            e.preventDefault();
            const t = ci.value.trim(); ci.value = ''; if (!t) return;
            const m = t.match(/^\/nick\s+(.+)/);
            if (m) { nick = m[1].slice(0, 20); try { localStorage.setItem('nick', nick) } catch (e) { } addMsg({ name: '', text: 'You are now ' + nick }); return; }
            sock.emit('chat', { name: nick, text: t });
        };
        sock.on('chat', addMsg);
        sock.on('history', h => h.forEach(addMsg));

        /* ---------- misc ---------- */
        function block(t) { const d = document.createElement('div'); d.className = 'overlay'; const p = document.createElement('p'); p.textContent = t; d.append(p); document.body.append(d); }
        function enter() { $('enter').remove(); sock.emit('join', { room }); }
        function copyLink(b) { navigator.clipboard.writeText(location.href); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy link', 1200); }
    </script>
</body>

</html>
